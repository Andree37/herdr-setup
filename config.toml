onboarding = false

# tmux-style: a workspace is a session (one per project, claude in it),
# a tab is a window. prefix+f opens projects / starts sessions; the herdr-views
# plugin (github.com/Andree37/herdr-views) adds prefix+a agents, prefix+p PRs, prefix+shift+l links,
# a tree of agents under each space, and an Agents panel of only blocked/done.

[keys]
prefix = "ctrl+space"

previous_tab = "prefix+["
next_tab = "prefix+]"
previous_workspace = "prefix+shift+9"   # prefix+( like tmux
next_workspace = "prefix+shift+0"       # prefix+)
cycle_pane_previous = "prefix+left"
cycle_pane_next = "prefix+right"
toggle_sidebar = "prefix+b"
rename_tab = "prefix+ctrl+t"   # prefix+shift+t opens code-tree below the agent
# Defaults moved to prefix+ctrl+<same letter>, their keys went to plugins:
settings = "prefix+ctrl+s"                  # prefix+s is the spaces tree
open_notification_target = "prefix+ctrl+o"  # prefix+o is back
goto = "prefix+ctrl+g"                      # prefix+g is lazygit
new_worktree = "prefix+ctrl+shift+g"        # prefix+shift+g is lazygit below

# Picker: open tabs with their agent's state (blocked and done first), then
# every ~/github/<org>/<repo>.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.local/bin/herdr-sessionizer"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "local.herdr-views.open-agents"
description = "travel to an agent"

[[keys.command]]
key = "prefix+s"   # like tmux's choose-tree
type = "plugin_action"
command = "local.herdr-views.open-tree"
description = "spaces, tabs and agents as a tree"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "local.herdr-views.open-prs"
description = "my pull requests"

[[keys.command]]
key = "prefix+shift+l"   # prefix+shift+r is herdr's reload_config
type = "plugin_action"
command = "local.herdr-views.open-refs"
description = "links this agent mentioned"

# Travel (herdr-views): back and forward through the panes you focused, like a
# browser, and straight to the agent that needs you most (blocked, then done).
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "local.herdr-views.back"
description = "back to the previous pane"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "local.herdr-views.forward"
description = "forward again"

[[keys.command]]
key = "prefix+n"
type = "plugin_action"
command = "local.herdr-views.needs-you"
description = "agent that needs you"

# Intercom (herdr-intercom plugin): every agent session and message, as a popup.
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "andree37.intercom.open"
description = "intercom"

# code-tree (herdr-ct plugin): the project's work tree beside this agent.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "andree37.ct.open"
description = "code-tree beside this agent"

[[keys.command]]
key = "prefix+shift+t"   # rename_tab moved to prefix+ctrl+t
type = "plugin_action"
command = "andree37.ct.open-below"
description = "code-tree below this agent"

# lazygit (herdr-lazygit plugin): beside the agent, in its repo. Same key jumps
# to it, or closes it when you are on it.
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "andree37.lazygit.toggle"
description = "lazygit beside this agent"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "andree37.lazygit.toggle-below"
description = "lazygit below this agent"

[ui]
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"
# The space rows carry a status column; the 26-column default truncated it.
sidebar_width = 38
sidebar_max_width = 48
prompt_new_tab_name = false
window_title = "{workspace}"

# Space rows. $hv_a1..$hv_a6 are workspace metadata herdr-views writes: one
# indented line per agent in that space, so the panel reads as a tree. Not
# clickable, and capped at five agents plus a "+N more" line.
[ui.sidebar.spaces]
row_gap = 0
rows = [
    ["state_icon", "workspace"],
    ["$hv_a1"],
    ["$hv_a2"],
    ["$hv_a3"],
    ["$hv_a4"],
    ["$hv_a5"],
    ["$hv_a6"],
]

# The Agents panel is the attention queue: herdr-views filters it to agents
# that are blocked or done, or whose code-tree has a point waiting for you.
[ui.sidebar.agents.rows_by_agent]
claude = [
    ["state_icon", "workspace", "tab"],
    [
        { token = "state_text", fg = "#89b4fa" },
        { token = "$hv_pr", dim = true },
    ],
    # code-tree: what waits for you, then the card this Claude is on
    [
        { token = "$hv_ct_you", fg = "#fe8019" },
        { token = "$hv_ct", dim = true },
    ],
]

# Herdr's own toasts when an agent changes state in the background.
[ui.toast]
delivery = "herdr"

[theme]
name = "gruvbox"
auto_switch = false
